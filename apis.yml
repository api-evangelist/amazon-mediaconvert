aid: amazon-mediaconvert
name: Amazon MediaConvert
description: AWS Elemental MediaConvert is a file-based video transcoding service that allows you to easily create video-on-demand
  (VOD) content for broadcast and multiscreen delivery at scale. It supports broadcast-grade features including graphic overlays,
  content protection, multi-language audio, closed captioning, and a comprehensive range of video formats.
